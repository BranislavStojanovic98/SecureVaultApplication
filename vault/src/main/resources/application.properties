spring.application.name=vault

server.port=${PORT}
spring.datasource.url=${DB_SOURCE}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

jwa.private.key=${JWA_PK}
jwt.expiration.hours=${EXP_H}
token.signing.key=${TOKEN_KEY}

server.ssl.enabled=true
server.ssl.key-store=${KEYSTORE_LOCATION}
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${KEYSTORE_PASS}
server.ssl.key-alias=${KEYSTORE_ALIAS}